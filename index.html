/* ---------- 6. GESTURES ---------- */

// Swipe a row: right = done, left = delete. The row's "face" slides over the colored action underneath.
function enableSwipe(row, { onLeft, onRight }) {
  const face = row.querySelector('.row-face');
  let sx = 0, sy = 0, dx = 0, active = false, decided = false, pid = null;
  face.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    sx = e.clientX; sy = e.clientY; dx = 0; active = true; decided = false; pid = e.pointerId;
  });
  face.addEventListener('pointermove', e => {
    if (!active) return;
    if (e.pointerType === 'mouse' && e.buttons === 0) { active = false; return; }
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!decided) {
      if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;     // not moved enough to know yet
      if (Math.abs(my) > Math.abs(mx)) { active = false; return; } // mostly vertical → let the page scroll
      decided = true; row.classList.add('swiping');
      try { face.setPointerCapture(pid); } catch (err) {}
    }
    dx = Math.max(-140, Math.min(140, mx));
    if (dx > 0 && !onRight) dx *= 0.25;   // a direction with no action only gives a little
    if (dx < 0 && !onLeft) dx *= 0.25;
    face.style.transform = `translateX(${dx}px)`;
    row.classList.toggle('reveal-right', dx > 0);
    row.classList.toggle('reveal-left', dx < 0);
    const armed = Math.abs(dx) > 80;
    if (armed && !row.classList.contains('armed')) haptic(6);
    row.classList.toggle('armed', armed);
  });
  const end = () => {
    if (!active) return;
    active = false;
    if (decided) { row.dataset.swiped = '1'; setTimeout(() => { delete row.dataset.swiped; }, 120); }
    row.classList.remove('swiping');
    if (dx > 80 && onRight) { face.style.transform = 'translateX(110%)'; setTimeout(onRight, 140); }
    else if (dx < -80 && onLeft) { face.style.transform = 'translateX(-110%)'; setTimeout(onLeft, 140); }
    else { face.style.transform = ''; row.classList.remove('armed', 'reveal-left', 'reveal-right'); }
  };
  face.addEventListener('pointerup', end);
  face.addEventListener('pointercancel', end);
  // a swipe should not also count as a tap
  row.addEventListener('click', e => { if (row.dataset.swiped) { e.stopPropagation(); e.preventDefault(); } }, true);
}

// Long-press (hold half a second) on a note opens it for editing.
function enableLongPress(el, fn) {
  let t = null, sx = 0, sy = 0;
  el.addEventListener('pointerdown', e => {
    sx = e.clientX; sy = e.clientY;
    t = setTimeout(() => { t = null; el.dataset.lp = '1'; haptic(15); fn(); setTimeout(() => { delete el.dataset.lp; }, 400); }, 500);
  });
  const cancel = () => { if (t) { clearTimeout(t); t = null; } };
  el.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) cancel(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('click', e => { if (el.dataset.lp) { e.stopPropagation(); e.preventDefault(); } }, true);
}

// after a screen is drawn, give its rows their gestures
function wireRows(root) {
  root.querySelectorAll('.row[data-swipe]').forEach(row => {
    const type = row.dataset.type, id = row.dataset.id;
    const opts = { onLeft: () => removeItem(type, id) };
    if (type === 'chore') opts.onRight = () => toggleChore(id);
    enableSwipe(row, opts);
    if (row.hasAttribute('data-longpress')) enableLongPress(row, () => openSheet(type, id));
  });
}

// Swipe the week strip sideways to move a week.
function shiftWeek(n) {
  calWeek = addDays(calWeek, 7 * n);
  const t = today();
  calSel = (startOfWeek(t).getTime() === calWeek.getTime()) ? isoDate(t) : isoDate(calWeek);
  render();
  const strip = $('#weekStrip'); if (strip) strip.classList.add(n > 0 ? 'slide-left' : 'slide-right');
}
function enableWeekSwipe(strip) {
  if (!strip) return;
  let sx = 0, sy = 0, pid = null, tracking = false;
  strip.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; pid = e.pointerId; tracking = true; });
  strip.addEventListener('pointermove', e => {
    if (!tracking || e.pointerId !== pid) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) { tracking = false; shiftWeek(dx < 0 ? 1 : -1); }
  });
  ['pointerup', 'pointercancel'].forEach(ev => strip.addEventListener(ev, () => { tracking = false; }));
}

// Drag the sheet's handle down to close it.
(function enableSheetDrag() {
  const handle = $('#handle'), sheet = $('#sheet');
  let sy = 0, dy = 0, on = false;
  handle.addEventListener('pointerdown', e => { sy = e.clientY; dy = 0; on = true; sheet.classList.add('dragging'); handle.setPointerCapture(e.pointerId); });
  handle.addEventListener('pointermove', e => { if (!on) return; dy = Math.max(0, e.clientY - sy); sheet.style.transform = `translate(-50%, ${dy}px)`; });
  const end = () => { if (!on) return; on = false; sheet.classList.remove('dragging'); if (dy > 110) closeSheet(); else sheet.style.transform = ''; };
  handle.addEventListener('pointerup', end); handle.addEventListener('pointercancel', end);
  $('#backdrop').addEventListener('click', closeSheet);
})();

/* ---------- 7. DYNAMISM ---------- */
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// The countdown updates four numbers once a second instead of redrawing the whole screen.
function tickCountdown() {
  const box = $('#countdown');
  if (!box) return;
  const target = Number(box.dataset.target);
  const ms = target - Date.now();
  const digits = $('#cdDigits'), now = $('#cdNow');
  if (ms <= 0) {
    if (ms < -3600e3) { renderToday(); return; }         // an hour after it started, move on to the next event
    digits.hidden = true; now.hidden = false; return;
  }
  digits.hidden = false; now.hidden = true;
  const d = Math.floor(ms / 86400e3), h = Math.floor(ms % 86400e3 / 3600e3), m = Math.floor(ms % 3600e3 / 60e3), s = Math.floor(ms % 60e3 / 1000);
  $('#cd-d').textContent = pad(d); $('#cd-h').textContent = pad(h); $('#cd-m').textContent = pad(m); $('#cd-s').textContent = pad(s);
}
setInterval(() => { if (current === 'today') tickCountdown(); }, 1000);

let toastTimer = null;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button class="undo" type="button">Undo</button>' : ''}`;
  if (undo) el.querySelector('.undo').addEventListener('click', () => { undo(); el.classList.remove('show'); haptic(8); });
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 5000 : 2600);
}

// when the app comes back to the foreground (phone unlocked, tab switched back), refresh what's stale
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

/* =====================================================================
   8. GOOGLE SERVICES — weather and drive times
   Web services from Google Maps Platform, called straight from the browser:
     Weather API  https://weather.googleapis.com/v1/...   (current conditions, hourly and daily forecasts)
     Routes API   https://routes.googleapis.com/directions/v2:computeRoutes   (drive time with traffic, the route, the steps)
     Places API   https://places.googleapis.com/v1/places:autocomplete   (address suggestions while typing)
     Maps JavaScript API — the route map inside an event, loaded only when needed
   Both need an API key from Google Cloud. The key lives in this device's storage — never in this file —
   so the code can be public while the key stays yours. Google should only accept the key from your
   website's address (set "Website restrictions" on the key in Google Cloud).
   Everything Google sends back is cached, so opening the app ten times costs one request, not ten.
   ===================================================================== */
const GSET_KEY = 'familyhub.google.v1';       // settings: key, home, units
const GCACHE_KEY = 'familyhub.googlecache.v2'; // what Google told us, and when (v2: routes now carry their shape and steps)
const WEATHER_TTL = 30 * 60e3;                // re-ask for weather after 30 minutes
const ROUTE_TTL = 30 * 60e3;                  // re-ask for a drive time after 30 minutes...
const ROUTE_TTL_SOON = 10 * 60e3;             // ...or 10 minutes when the event is within two hours
const ERROR_TTL = 5 * 60e3;                   // after an error, wait 5 minutes before trying again
const ROUTE_HORIZON = 7 * 86400e3;            // only ask about events in the next 7 days
const ROUTE_MAX_PER_SYNC = 6;                 // never more than 6 drive-time requests per refresh

let gset = loadJSON(GSET_KEY, { apiKey: '', homeAddress: '', lat: null, lng: null, units: 'F' });
let gcache = loadJSON(GCACHE_KEY, { weather: null, routes: {}, venues: {} });   // venues: forecasts at event locations, by "lat,lng"
const inflight = {};                          // requests already on their way, so nothing is asked twice

function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); if (raw) return { ...fallback, ...JSON.parse(raw) }; } catch (e) {}
  return fallback;
}
function saveGoogleSettings() { try { localStorage.setItem(GSET_KEY, JSON.stringify(gset)); } catch (e) {} }
function saveGoogleCache() {
  // forget drive times for events that are already over, and venue forecasts nobody has asked about for a day
  const cutoff = Date.now() - 86400e3;
  for (const k of Object.keys(gcache.routes)) if ((gcache.routes[k].eventAt || 0) < cutoff) delete gcache.routes[k];
  gcache.venues = gcache.venues || {};
  for (const k of Object.keys(gcache.venues)) if ((gcache.venues[k].at || 0) < cutoff) delete gcache.venues[k];
  try { localStorage.setItem(GCACHE_KEY, JSON.stringify(gcache)); } catch (e) {}
}
function hasLoc() { return typeof gset.lat === 'number' && typeof gset.lng === 'number' && !Number.isNaN(gset.lat) && !Number.isNaN(gset.lng); }
function hasHome() { return !!gset.homeAddress || hasLoc(); }
function unitsSystem() { return gset.units === 'C' ? 'METRIC' : 'IMPERIAL'; }

// Opening the app through an "Add a phone" code (…?setup=…) or a plain key link (…?key=AIza…) saves the
// settings on this device, then hides them from the address bar.
function importSetupFromUrl() {
  try {
    const url = new URL(location.href);
    const k = url.searchParams.get('key'), s = url.searchParams.get('setup');
    if (!k && !s) return;
    if (s) {
      const json = decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
      const p = JSON.parse(json);
      if (typeof p.k === 'string') gset.apiKey = p.k.trim();
      if (typeof p.h === 'string') gset.homeAddress = p.h;
      if (typeof p.lat === 'number' && typeof p.lng === 'number') { gset.lat = p.lat; gset.lng = p.lng; }
      if (p.u === 'C' || p.u === 'F') gset.units = p.u;
    } else {
      gset.apiKey = k.trim();
    }
    saveGoogleSettings();
    url.searchParams.delete('key'); url.searchParams.delete('setup');
    history.replaceState(null, '', url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : '') + url.hash);
    setTimeout(() => toast(s ? 'This phone is set up — weather and drive times are on' : 'Google key saved on this device'), 400);
  } catch (e) {}
}

// One function does every request. Google answers errors as JSON: { error: { code, message, status } }.
async function googleFetch(url, init) {
  let res;
  try { res = await fetch(url, init); }
  catch (e) { throw new Error('NETWORK'); }            // no internet, or this host blocks outside connections
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error && data.error.message) || `Google replied with error ${res.status}`);
  return data;
}
// Turn Google's error text into a sentence that says what to do.
function friendlyError(msg) {
  msg = String(msg || '');
  if (msg === 'NETWORK') return 'Couldn’t reach Google from this page. The copy on Claude can’t contact outside services — open the app from your own website address instead. Otherwise check the internet connection.';
  if (/API key not valid|API_KEY_INVALID/i.test(msg)) return 'Google says this key isn’t valid. Check that the whole key was pasted, with no spaces.';
  if (/referer|referrer/i.test(msg)) return 'Google refused this website. In the key’s settings under “Website restrictions”, add this site’s address (for example https://yourname.github.io/*).';
  if (/has not been used|is disabled|not enabled/i.test(msg)) return 'That API isn’t turned on in your Google Cloud project yet. Enable it under APIs & Services → Library, then wait a minute.';
  if (/billing/i.test(msg)) return 'Google Cloud needs a billing account on the project before it will answer (the monthly free amount still applies).';
  if (/quota|RESOURCE_EXHAUSTED|rate limit/i.test(msg)) return 'You’ve reached the usage limit set in Google Cloud for today. It resets tomorrow, or raise the quota.';
  if (/PERMISSION_DENIED|not authorized|blocked/i.test(msg)) return 'Google refused the request: ' + msg;
  return msg;
}

/* --- weather --- */
const WX_BASE = 'https://weather.googleapis.com/v1';

function weatherQuery(lat = gset.lat, lng = gset.lng) {
  return `key=${encodeURIComponent(gset.apiKey)}&location.latitude=${lat}&location.longitude=${lng}&unitsSystem=${unitsSystem()}`;
}
// Google hands the hourly forecast out 24 hours per page; two pages make the 48 hours the event pills use.
async function fetchHours(q) {
  let url = `${WX_BASE}/forecast/hours:lookup?${q}&hours=48&pageSize=24`, all = [];
  for (let page = 0; page < 2 && url; page++) {
    const data = await googleFetch(url);
    all = all.concat(data.forecastHours || []);
    url = data.nextPageToken ? `${WX_BASE}/forecast/hours:lookup?${q}&hours=48&pageSize=24&pageToken=${encodeURIComponent(data.nextPageToken)}` : null;
  }
  return { forecastHours: all };
}
// Ask Google for the weather unless what we have is still fresh. Resolves when the cache is updated.
function refreshWeather(force = false) {
  if (!gset.apiKey || !hasLoc()) return Promise.resolve();
  const loc = `${gset.lat},${gset.lng}`, units = gset.units;
  const w = gcache.weather;
  const same = w && w.loc === loc && w.units === units;
  const fresh = same && w.current && Date.now() - w.at < WEATHER_TTL;
  const failedRecently = same && w.error && Date.now() - (w.errorAt || 0) < ERROR_TTL;
  if (!force && (fresh || failedRecently)) return Promise.resolve();
  if (inflight.weather) return inflight.weather;
  inflight.weather = (async () => {
    const q = weatherQuery();
    try {
      // three answers, asked for at the same time: right now, the next 7 days, the next 48 hours
      const [cur, days, hours] = await Promise.all([
        googleFetch(`${WX_BASE}/currentConditions:lookup?${q}`),
        googleFetch(`${WX_BASE}/forecast/days:lookup?${q}&days=7&pageSize=7`),
        fetchHours(q).catch(() => null),   // hourly detail is a bonus; the daily forecast still works without it
      ]);
      gcache.weather = normalizeWeather(cur, days, hours, loc, units);
    } catch (e) {
      // keep yesterday's answer on screen, but remember that the refresh failed
      gcache.weather = { ...(same ? w : { loc, units, at: 0 }), error: e.message, errorAt: Date.now() };
    }
    saveGoogleCache();
    delete inflight.weather;
    if (current === 'today' || current === 'calendar') render();
    if (current === 'family') updateGStatus();
  })();
  return inflight.weather;
}
// Keep only what the app shows. Field names on the right are Google's; on the left are ours.
function normalizeWeather(cur, days, hours, loc, units) {
  const cond = c => ({ type: c?.weatherCondition?.type || '', text: c?.weatherCondition?.description?.text || '' });
  const d0 = (days.forecastDays || [])[0];
  const current = {
    temp: cur.temperature?.degrees, feels: cur.feelsLikeTemperature?.degrees, ...cond(cur), isDay: cur.isDaytime !== false,
    hum: cur.relativeHumidity, uv: cur.uvIndex, rain: cur.precipitation?.probability?.percent ?? 0,
    wind: cur.wind?.speed?.value, windDir: cur.wind?.direction?.cardinal || '',
    hi: d0?.maxTemperature?.degrees ?? cur.currentConditionsHistory?.maxTemperature?.degrees,
    lo: d0?.minTemperature?.degrees ?? cur.currentConditionsHistory?.minTemperature?.degrees,
    time: cur.currentTime,
  };
  const { days: dayList, hours: hourList } = normalizeForecast(days, hours);
  return { at: Date.now(), loc, units, current, days: dayList, hours: hourList, error: null, errorAt: 0 };
}
// The daily and hourly lists, trimmed to what the app shows (shared by home weather and venue weather).
function normalizeForecast(days, hours) {
  const cond = c => ({ type: c?.weatherCondition?.type || '', text: c?.weatherCondition?.description?.text || '' });
  const dayList = ((days && days.forecastDays) || []).map(d => ({
    date: `${d.displayDate.year}-${pad(d.displayDate.month)}-${pad(d.displayDate.day)}`,
    max: d.maxTemperature?.degrees, min: d.minTemperature?.degrees,
    day: { ...cond(d.daytimeForecast), rain: d.daytimeForecast?.precipitation?.probability?.percent ?? 0 },
    night: { ...cond(d.nighttimeForecast), rain: d.nighttimeForecast?.precipitation?.probability?.percent ?? 0 },
    sunrise: d.sunEvents?.sunriseTime, sunset: d.sunEvents?.sunsetTime,
  }));
  const hourList = ((hours && hours.forecastHours) || []).map(h => ({
    start: Date.parse(h.interval.startTime), end: Date.parse(h.interval.endTime),
    temp: h.temperature?.degrees, ...cond(h), isDay: h.isDaytime !== false, rain: h.precipitation?.probability?.percent ?? 0,
  }));
  return { days: dayList, hours: hourList };
}

/* --- weather at the venue: the route tells us where the event is, so ask Google about that spot too --- */
const VENUE_MAX_PER_SYNC = 3;                 // never more than 3 venue forecasts per refresh
function venueKey(end) { return `${end.lat.toFixed(3)},${end.lng.toFixed(3)}`; }   // 3 decimals ≈ 100 m — the same field, one forecast
function refreshVenueWeather(end, force = false) {
  if (!gset.apiKey || !end) return Promise.resolve();
  const k = venueKey(end), v = (gcache.venues || (gcache.venues = {}))[k], units = gset.units;
  const fresh = v && v.units === units && v.days && Date.now() - v.at < WEATHER_TTL;
  const failedRecently = v && v.error && Date.now() - (v.errorAt || 0) < ERROR_TTL;
  if (!force && (fresh || failedRecently)) return Promise.resolve();
  const ik = 'venue:' + k;
  if (inflight[ik]) return inflight[ik];
  inflight[ik] = (async () => {
    const q = weatherQuery(end.lat, end.lng);
    try {
      const [days, hours] = await Promise.all([
        googleFetch(`${WX_BASE}/forecast/days:lookup?${q}&days=7&pageSize=7`),
        fetchHours(q).catch(() => null),
      ]);
      gcache.venues[k] = { at: Date.now(), units, ...normalizeForecast(days, hours), error: null, errorAt: 0 };
    } catch (e) {
      gcache.venues[k] = { ...(v || { at: 0, units }), error: e.message, errorAt: Date.now() };
    }
    saveGoogleCache();
    delete inflight[ik];
    if (current === 'today' || current === 'calendar') render();
  })();
  return inflight[ik];
}
// Which icon for which sky. Google reports ~40 condition types; we draw nine.
function wxIcon(type, isDay = true) {
  const t = type || '';
  if (/THUNDER/.test(t)) return 'wx-storm';
  if (/SNOW|HAIL|BLOWING/.test(t)) return 'wx-snow';
  if (/RAIN|SHOWER/.test(t)) return 'wx-rain';
  if (t === 'WINDY') return 'wx-wind';
  if (t === 'CLOUDY') return 'wx-cloud';
  if (t === 'PARTLY_CLOUDY' || t === 'MOSTLY_CLOUDY') return isDay ? 'wx-partly' : 'wx-partly-night';
  if (t === 'CLEAR' || t === 'MOSTLY_CLEAR') return isDay ? 'sun' : 'wx-moon';
  return isDay ? 'wx-partly' : 'wx-cloud';
}
// The forecast for the hour of an event — at the venue when the route has told us where that is, otherwise at home.
// From the hourly list when the event is within 48h, else from the day's forecast.
function wxForEvent(e) {
  const r = e.address ? gcache.routes[routeKey(e)] : null;
  const venue = r && r.end && gcache.venues ? gcache.venues[venueKey(r.end)] : null;
  const w = venue && venue.days && venue.days.length ? venue : gcache.weather;
  if (!w || !w.days || !w.days.length) return null;
  const at = parseDT(e.date, e.time), ms = at.getTime();
  if (ms < Date.now() - 3600e3) return null;                       // it already happened
  const h = (w.hours || []).find(x => ms >= x.start && ms < x.end);
  if (h && typeof h.temp === 'number') return { temp: h.temp, type: h.type, text: h.text, isDay: h.isDay, rain: h.rain, approx: false, venue: w === venue };
  const d = w.days.find(x => x.date === e.date);
  if (!d) return null;
  const night = at.getHours() >= 19 || at.getHours() < 7;          // Google splits each day at 7 AM and 7 PM
  const part = night ? d.night : d.day;
  const temp = night ? d.min : d.max;
  if (!part || typeof temp !== 'number') return null;
  return { temp, type: part.type, text: part.text, isDay: !night, rain: part.rain, approx: true, venue: w === venue };
}
function wxPill(e) {
  const w = wxForEvent(e);
  if (!w) return '';
  const wet = rainForEvent(e);
  const rain = w.rain >= 30 ? ` <span style="opacity:.8">·</span> ${icon('drop')}${w.rain}%` : '';
  const where = w.venue ? `${icon('marker')}` : '';
  return `<span class="pill wxp${w.venue ? ' venue' : ''}${wet ? ' wet' : ''}" title="${esc(w.text)}${w.venue ? ' at the venue' : ' at home'}${w.approx ? ' (day forecast)' : ''}${wet ? ' · ' + esc(wet.label) : ''}">${where}${icon(wxIcon(w.type, w.isDay))}${Math.round(w.temp)}°${rain}</span>`;
}

/* --- rain nudges: what a wet forecast means for the event, and for the drive to it --- */
const RAIN_LIKELY = 50;                       // the chance (%) at which the app starts saying "rain likely"
function hoursIn(list, from, to) { return (list || []).filter(x => x.end > from && x.start < to); }
function wetKind(h) { const t = (h && h.type) || ''; return /THUNDER/.test(t) ? 'storm' : /SNOW|HAIL|BLOWING/.test(t) ? 'snow' : 'rain'; }
// Is this hour (or day-part) wet enough to mention? Storms and snow count at a lower chance than plain rain.
function isWet(h) { return !!h && (h.rain >= RAIN_LIKELY || (wetKind(h) !== 'rain' && h.rain >= 30)); }
function wettest(hours) {                     // the worst hour in a window: storms first, then snow, then the highest rain chance
  let worst = null;
  for (const h of hours) { const score = (h.rain || 0) + { storm: 300, snow: 200, rain: 0 }[wetKind(h)]; if (!worst || score > worst.score) worst = { ...h, score }; }
  return worst;
}
// The forecast that applies to the event itself (at the venue when we know it) and the one for the drive (from home).
function forecastsFor(e) {
  const r = e.address ? gcache.routes[routeKey(e)] : null;
  const venue = r && r.end && gcache.venues ? gcache.venues[venueKey(r.end)] : null;
  const home = gcache.weather;
  return { r, home, event: venue && venue.days && venue.days.length ? venue : home };
}
// null when it looks dry; otherwise { kind, pct, at, where: 'event'|'drive', label, tip }.
function rainForEvent(e) {
  const at = parseDT(e.date, e.time).getTime();
  if (at < Date.now() - 3600e3) return null;
  const { r, home, event: wx } = forecastsFor(e);
  if (!wx || !wx.days || !wx.days.length) return null;
  const during = wettest(hoursIn(wx.hours, at, at + 2 * 3600e3));                 // the event: its first two hours
  const drive = r && r.sec && home ? wettest(hoursIn(home.hours, at - r.sec * 1000 - 5 * 60e3, at)) : null;   // the drive there
  let hit = isWet(during) ? { kind: wetKind(during), pct: during.rain, at: during.start, where: 'event' }
          : isWet(drive) ? { kind: wetKind(drive), pct: drive.rain, at: drive.start, where: 'drive' } : null;
  if (!hit && !hoursIn(wx.hours, at, at + 3600e3).length) {                          // beyond the hourly forecast: use the day's
    const d = wx.days.find(x => x.date === e.date), hr = new Date(at).getHours();
    const part = d && ((hr >= 19 || hr < 7) ? d.night : d.day);
    if (isWet(part)) hit = { kind: wetKind(part), pct: part.rain, at, where: 'event', approx: true };
  }
  if (!hit) return null;
  const what = { rain: 'Rain', storm: 'Thunderstorms', snow: 'Snow' }[hit.kind];
  hit.label = hit.where === 'drive' ? `${what} likely on the drive (${hit.pct}%)` : `${what} likely${hit.approx ? '' : ' around ' + clock(hit.at)} (${hit.pct}%)`;
  hit.tip = hit.kind === 'storm' ? 'Leave early and expect delays' : hit.kind === 'snow' ? 'Allow extra time' : (hit.where === 'drive' ? 'Leaving a little earlier' : 'Umbrella or a jacket');
  return hit;
}
// Leave earlier when the drive itself looks wet: 15% of the drive for rain, 30% for storms or snow — at least 3 minutes, at most 20.
function rainBuffer(e, r) {                   // → { sec, kind } or null
  if (!r || !r.sec) return null;
  const home = gcache.weather;
  if (!home || !home.hours || !home.hours.length) return null;
  const at = parseDT(e.date, e.time).getTime();
  const h = wettest(hoursIn(home.hours, at - r.sec * 1000 - 5 * 60e3, at));
  if (!isWet(h)) return null;
  const kind = wetKind(h);
  return { sec: Math.min(20 * 60, Math.max(3 * 60, Math.round(r.sec * (kind === 'rain' ? 0.15 : 0.3)))), kind };
}
// One line under the countdown, or under an event in its sheet: the nudge in words.
function nudgeLine(e, { inCard = true } = {}) {
  const n = rainForEvent(e);
  if (!n) return '';
  const glyph = icon(n.kind === 'storm' ? 'wx-storm' : n.kind === 'snow' ? 'wx-snow' : 'wx-rain');
  return inCard
    ? `<div class="nudge" role="note">${glyph}<div><b>${esc(n.label)}</b> <span>· ${esc(n.tip)}</span></div></div>`
    : `<div class="nudge-row" role="note">${glyph}<div><b>${esc(n.label)}</b> · ${esc(n.tip)}</div></div>`;
}
function agoShort(ts) { const m = Math.round((Date.now() - ts) / 60e3); return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : `${Math.round(m / 60)}h ago`; }

// The strip at the top of Today. Every state explains itself and leads somewhere.
function weatherStrip() {
  const go = (title, body, glyph = 'wx-partly') => `<button class="wx wx-empty" data-act="tab" data-tab="family" aria-label="${esc(title)}"><span class="glyph">${icon(glyph)}</span><span class="grow"><span class="temp">${title}</span><span class="cond">${body}</span></span><span class="chev">${icon('right')}</span></button>`;
  if (!gset.apiKey) return go('Add the weather', 'Paste your Google API key in Family settings');
  if (!hasLoc()) return go('Where’s home?', 'Set a weather location in Family settings', 'nav');
  const w = gcache.weather;
  if (!w || !w.current) {
    if (w && w.error) { const why = friendlyError(w.error); return go('Weather unavailable', esc(why.length > 90 ? why.slice(0, 90) + '…' : why), 'alert'); }
    return `<div class="wx wx-empty" aria-busy="true"><span class="glyph">${icon('loader')}</span><span class="grow"><span class="temp">Checking the sky…</span><span class="cond">Asking Google for the weather</span></span></div>`;
  }
  const c = w.current;
  const hi = typeof c.hi === 'number' ? `${Math.round(c.hi)}°` : '–', lo = typeof c.lo === 'number' ? `${Math.round(c.lo)}°` : '–';
  const stale = w.error ? ' · offline' : '';
  return `<button class="wx" data-act="open-sheet" data-kind="weather" aria-label="Weather: ${Math.round(c.temp)} degrees, ${esc(c.text)}. Tap for the forecast.">
    <span class="glyph">${icon(wxIcon(c.type, c.isDay))}</span>
    <span class="grow"><span class="temp">${Math.round(c.temp)}°</span><span class="cond">${esc(c.text)} · feels ${Math.round(c.feels)}°${stale}</span></span>
    <span class="side">H <b>${hi}</b> L <b>${lo}</b><br>${icon('drop')} ${c.rain}% rain</span>
  </button>`;
}
// The slide-up detail sheet: now, four numbers, seven days.
function weatherSheet() {
  const w = gcache.weather;
  if (!w || !w.current) return `<h2 id="sheetTitle">Weather</h2><p style="color:var(--muted)">Nothing to show yet.</p>`;
  const c = w.current, ts = isoDate(today());
  const fmtT = iso => iso ? clock(Date.parse(iso)) : '–';
  const windU = gset.units === 'C' ? 'km/h' : 'mph';
  const rows = w.days.map(d => `<div class="wx-day">
      <span class="dn${d.date === ts ? ' today' : ''}">${dayLabel(d.date) === 'Today' ? 'Today' : (daysFromToday(d.date) < 7 ? WD[parseDT(d.date).getDay()] : dayLabel(d.date))}</span>
      ${icon(wxIcon(d.day.type, true))}
      <span class="dc">${esc(d.day.text)}${d.day.rain >= 20 ? ` <small>· ${d.day.rain}% rain</small>` : ''}</span>
      <span class="hl">${Math.round(d.max)}° <span>${Math.round(d.min)}°</span></span>
    </div>`).join('');
  const d0 = w.days.find(d => d.date === ts);
  return `<h2 id="sheetTitle">Weather</h2>
    <div class="wx-hero"><span class="glyph">${icon(wxIcon(c.type, c.isDay))}</span>
      <div><div class="big">${Math.round(c.temp)}°</div><div class="txt">${esc(c.text)} · feels like ${Math.round(c.feels)}°</div></div></div>
    <div class="wx-stats">
      <div><b>${c.rain}%</b><span>Rain</span></div>
      <div><b>${c.hum ?? '–'}%</b><span>Humidity</span></div>
      <div><b>${typeof c.wind === 'number' ? Math.round(c.wind) : '–'}</b><span>${esc(windU)}${c.windDir ? ' ' + esc(c.windDir.replace(/NORTH/g, 'N').replace(/SOUTH/g, 'S').replace(/EAST/g, 'E').replace(/WEST/g, 'W').replace(/_/g, '')) : ''}</span></div>
      <div><b>${c.uv ?? '–'}</b><span>UV index</span></div>
    </div>
    ${d0 && d0.sunrise ? `<p class="hint" style="margin-top:10px">Sunrise ${fmtT(d0.sunrise)} · Sunset ${fmtT(d0.sunset)}</p>` : ''}
    <div class="wx-days">${rows}</div>
    <div class="wx-foot"><span>Google Weather · updated ${agoShort(w.at)}${w.error ? ' · last refresh failed' : ''}</span><button class="link" data-act="refresh-weather">Refresh</button></div>`;
}

/* --- drive times --- */
const ROUTES_URL = 'https://routes.googleapis.com/directions/v2:computeRoutes';

function routeKey(e) { return `${gset.homeAddress || `${gset.lat},${gset.lng}`}|${e.placeId || e.address}|${e.date} ${e.time}`; }
// Where the drive ends: the exact place picked from Google's suggestions when there is one, otherwise the typed address.
function destinationOf(e) { return e.placeId ? { placeId: e.placeId } : { address: e.address }; }
// Events worth asking about: in the future, within a week, with an address — nearest first.
function routesNeeded() {
  if (!gset.apiKey || !hasHome()) return [];
  const now = Date.now();
  return sortedEvents().filter(e => e.address && e.at.getTime() > now && e.at.getTime() - now < ROUTE_HORIZON).slice(0, ROUTE_MAX_PER_SYNC);
}
function refreshRoute(e, force = false) {
  const k = routeKey(e), r = gcache.routes[k], at = parseDT(e.date, e.time).getTime();
  const ttl = at - Date.now() < 2 * 3600e3 ? ROUTE_TTL_SOON : ROUTE_TTL;
  if (!force && r && r.sec && Date.now() - r.at < ttl) return Promise.resolve();
  if (!force && r && r.error && Date.now() - (r.errorAt || 0) < ERROR_TTL) return Promise.resolve();
  if (inflight[k]) return inflight[k];
  inflight[k] = (async () => {
    // Ask for traffic as it will be shortly before the event (Google needs a departure time in the future).
    const departure = new Date(Math.max(Date.now() + 2 * 60e3, at - 45 * 60e3)).toISOString();
    const origin = gset.homeAddress ? { address: gset.homeAddress } : { location: { latLng: { latitude: gset.lat, longitude: gset.lng } } };
    const body = { origin, destination: destinationOf(e), travelMode: 'DRIVE', routingPreference: 'TRAFFIC_AWARE', departureTime: departure };
    try {
      // The field mask is the list of answers we want back. Google works out the whole route either way;
      // we ask for the time, the time without traffic, the distance, the route's shape, the turn-by-turn steps
      // and where the trip ends (so the weather can be looked up at the venue).
      const data = await googleFetch(ROUTES_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': gset.apiKey, 'X-Goog-FieldMask': 'routes.duration,routes.staticDuration,routes.distanceMeters,routes.polyline.encodedPolyline,routes.legs.endLocation,routes.legs.steps.navigationInstruction.instructions,routes.legs.steps.distanceMeters,routes.legs.steps.staticDuration' },
        body: JSON.stringify(body),
      });
      const route = (data.routes || [])[0];
      if (!route) throw new Error('Google couldn’t find a driving route to that address.');
      const leg = (route.legs || [])[0] || {};
      const end = leg.endLocation && leg.endLocation.latLng ? { lat: leg.endLocation.latLng.latitude, lng: leg.endLocation.latLng.longitude } : null;
      const steps = (leg.steps || []).filter(s => s.navigationInstruction && s.navigationInstruction.instructions).map(s => ({ text: s.navigationInstruction.instructions, meters: s.distanceMeters || 0, sec: parseInt(s.staticDuration, 10) || 0 }));
      gcache.routes[k] = { at: Date.now(), eventAt: at, sec: parseInt(route.duration, 10) || 0, staticSec: parseInt(route.staticDuration, 10) || 0, meters: route.distanceMeters || 0, polyline: (route.polyline && route.polyline.encodedPolyline) || '', end, steps, error: null };
    } catch (err) {
      gcache.routes[k] = { ...(r || { eventAt: at }), error: err.message, errorAt: Date.now() };
    }
    saveGoogleCache();
    delete inflight[k];
    if (current === 'today' || current === 'calendar') render();
    if (sheetKind === 'event' && sheetId === e.id) mountDirections(e);   // the open event sheet gets its map and steps
    const done = gcache.routes[k];
    if (done && done.end) refreshVenueWeather(done.end);                  // weather where the event is, not just at home
  })();
  return inflight[k];
}
function distanceLabel(m) { return gset.units === 'C' ? `${(m / 1000).toFixed(m < 10000 ? 1 : 0)} km` : `${(m / 1609.344).toFixed(m < 16093 ? 1 : 0)} mi`; }
// What we know about the drive to an event, in words: { min, leaveAt, label, tone } or null.
function driveInfo(e) {
  if (!e.address || !gset.apiKey || !hasHome()) return null;
  const at = parseDT(e.date, e.time).getTime(), now = Date.now();
  if (at < now || at - now > ROUTE_HORIZON) return null;
  const r = gcache.routes[routeKey(e)];
  if (!r || (!r.sec && !r.error)) return { tone: 'quiet', label: 'Checking drive…', min: null };
  if (!r.sec) return { tone: 'quiet', label: 'No route found', min: null, error: r.error };
  // a wet drive moves "leave by" earlier (rainMin says by how much, so the screen can explain it)
  const rb = rainBuffer(e, r), bufSec = rb ? rb.sec : 0, rainMin = Math.round(bufSec / 60);
  const min = Math.max(1, Math.round(r.sec / 60)), leaveAt = at - (r.sec + bufSec) * 1000, untilLeave = leaveAt - now;
  const base = { min, leaveAt, meters: r.meters, stale: !!r.error, rainMin, rainKind: rb ? rb.kind : '' };
  if (untilLeave <= 0) return { tone: 'danger', label: `Leave now · ${min} min drive`, ...base };
  if (untilLeave < 30 * 60e3) return { tone: 'sun', label: `Leave in ${Math.ceil(untilLeave / 60e3)} min · ${min} min drive`, ...base };
  return { tone: '', label: `Leave by ${clock(leaveAt)} · ${min} min drive`, ...base };
}
// "· 5 min early for rain" — appended wherever the leave-by time is explained
function rainMinLabel(d) { return d && d.rainMin ? ` · ${d.rainMin} min early for ${{ rain: 'rain', storm: 'storms', snow: 'snow' }[d.rainKind] || 'rain'}` : ''; }
function drivePill(e) {
  const d = driveInfo(e);
  if (!d) return '';
  const r = gcache.routes[routeKey(e)];
  const extra = r && r.sec && r.staticSec ? Math.round((r.sec - r.staticSec) / 60) : 0;
  const mins = d.min == null ? '' : `${d.min}${extra >= 2 ? ` (+${extra})` : ''} min`;
  const short = d.min == null ? d.label : (d.tone === 'danger' ? `Leave now · ${mins}` : d.tone === 'sun' ? `Leave in ${Math.ceil((d.leaveAt - Date.now()) / 60e3)} min · ${mins}` : `${mins} · leave ${clock(d.leaveAt)}`);
  return `<span class="pill drive ${d.tone}" title="${esc(d.error || d.label)}${extra >= 2 ? ` (+${extra} min of traffic right now)` : ''}${esc(rainMinLabel(d))}">${icon('car')}${short}${d.rainMin ? icon('drop') : ''}</span>`;
}
function driveLine(e) {      // the fuller version inside the countdown card — tap it for the map and directions
  const d = driveInfo(e);
  if (!d) return '';
  const sub = d.min == null ? '' : `<span class="sub">${distanceLabel(d.meters)}${trafficLabel(gcache.routes[routeKey(e)])}${d.rainMin ? ` · +${d.rainMin} min ${d.rainKind === 'rain' ? 'rain' : d.rainKind}` : ''}${d.stale ? ' · offline' : ''}</span>`;
  return `<div class="drive${d.tone === 'danger' ? ' late' : ''}" data-act="open-sheet" data-kind="event" data-id="${e.id}" role="button" tabindex="0" title="${esc(d.label + rainMinLabel(d))}">${icon('car')}<span>${esc(d.label)}</span>${sub}<span class="chev">${icon('right')}</span></div>`;
}
// "+4 min traffic" when the drive is slower than usual right now (Google gives both numbers)
function trafficLabel(r) {
  if (!r || !r.sec || !r.staticSec) return '';
  const extra = Math.round((r.sec - r.staticSec) / 60);
  return extra >= 2 ? ` · +${extra} min traffic` : '';
}

/* --- directions: the Go button, the route map and the turn-by-turn steps, inside an event's sheet --- */
function mapsLinks(e) {
  const origin = gset.homeAddress || `${gset.lat},${gset.lng}`;
  return {
    google: `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(e.address)}${e.placeId ? `&destination_place_id=${encodeURIComponent(e.placeId)}` : ''}&travelmode=driving`,
    apple: `https://maps.apple.com/?saddr=${encodeURIComponent(origin)}&daddr=${encodeURIComponent(e.address)}&dirflg=d`,
  };
}
function directionsHtml(e) {
  if (!gset.apiKey || !hasHome()) return `<p class="hint">Add your Google key and home address in Family settings to get directions.</p>`;
  const r = gcache.routes[routeKey(e)], d = driveInfo(e), links = mapsLinks(e);
  const go = `<div class="actions" style="margin-top:8px"><a class="btn btn-primary" href="${links.google}" target="_blank" rel="noopener">${icon('nav')} Go</a><a class="btn btn-ghost" href="${links.apple}" target="_blank" rel="noopener">Apple Maps</a></div>`;
  if (!d) return `<p class="hint">Directions appear during the week before the event.</p>${go}`;
  const head = d.min == null
    ? `<p class="hint">${esc(d.error ? friendlyError(d.error) : d.label)}</p>`
    : `<div class="dirhead"><span class="big${d.tone === 'danger' ? ' late' : ''}">${d.min} min</span><span class="hint">${distanceLabel(d.meters)}${trafficLabel(r)} · ${d.tone === 'danger' ? 'leave now' : 'leave by ' + clock(d.leaveAt)}${esc(rainMinLabel(d))}</span></div>`;
  const map = `<div class="routemap" id="routeMap"><p class="hint">${r && r.polyline ? 'Loading the map…' : 'Getting the route…'}</p></div>`;
  const steps = r && r.steps && r.steps.length ? `<ol class="steps">${r.steps.map(s => `<li><span>${esc(s.text)}</span><span class="hint">${distanceLabel(s.meters)}</span></li>`).join('')}</ol>` : '';
  return head + nudgeLine(e, { inCard: false }) + go + map + steps;
}
async function mountDirections(e) {
  if (!e || !e.address || !gset.apiKey || !hasHome()) return;
  const at = parseDT(e.date, e.time).getTime();
  if (at < Date.now() || at - Date.now() > ROUTE_HORIZON) return;
  let r = gcache.routes[routeKey(e)];
  if (!r || !r.polyline) {                       // older cache entries have no shape or steps — ask once more
    await refreshRoute(e, true);
    if (!(sheetKind === 'event' && sheetId === e.id)) return;
    const box = $('#dirBox'); if (box) box.innerHTML = directionsHtml(e);
    r = gcache.routes[routeKey(e)];
  }
  const el = $('#routeMap');
  if (el && r && r.polyline) drawRouteMap(el, r);
}
// Google's map library is loaded the first time a map is needed, with the same key (Maps JavaScript API).
let mapsReady = null;
function loadGoogleMaps() {
  if (window.google && google.maps && google.maps.importLibrary) return Promise.resolve();
  if (mapsReady) return mapsReady;
  mapsReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(gset.apiKey)}&v=weekly&loading=async&libraries=geometry&callback=__mapsLoaded`;
    window.__mapsLoaded = () => resolve();
    s.onerror = () => { mapsReady = null; reject(new Error('NETWORK')); };
    document.head.appendChild(s);
    setTimeout(() => reject(new Error('The map took too long to load.')), 15000);
  });
  return mapsReady;
}
async function drawRouteMap(el, r) {
  try {
    await loadGoogleMaps();
    const path = google.maps.geometry.encoding.decodePath(r.polyline);
    el.innerHTML = '';
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const map = new google.maps.Map(el, { disableDefaultUI: true, zoomControl: true, gestureHandling: 'cooperative', colorScheme: dark ? 'DARK' : 'LIGHT', clickableIcons: false });
    new google.maps.Polyline({ path, map, strokeColor: '#2C4FD6', strokeOpacity: .9, strokeWeight: 5 });
    const dot = (pos, color) => new google.maps.Marker({ position: pos, map, icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 } });
    dot(path[0], '#2C4FD6'); dot(path[path.length - 1], '#D34A3E');
    const bounds = new google.maps.LatLngBounds(); path.forEach(p => bounds.extend(p)); map.fitBounds(bounds, 28);
  } catch (e) {
    el.innerHTML = `<p class="hint">The map couldn’t load. ${esc(friendlyError(e.message))}</p>`;
  }
}

/* --- Add a phone: a code that carries the key and settings to another device --- */
function setupLink() {
  const p = { k: gset.apiKey, h: gset.homeAddress, lat: gset.lat, lng: gset.lng, u: gset.units };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return `${location.origin}${location.pathname}?setup=${b64}`;
}
function phoneSheet() {
  if (!gset.apiKey) return `<h2 id="sheetTitle">Add a phone</h2><p class="hint">Paste your Google API key first — then this screen can hand it to other phones.</p>`;
  const link = setupLink();
  let svg = '';
  try { const qr = qrcode(0, 'M'); qr.addData(link); qr.make(); svg = qr.createSvgTag({ cellSize: 4, margin: 6, scalable: true }); } catch (e) { svg = ''; }
  return `<h2 id="sheetTitle">Add a phone</h2>
    <p class="hint">On the other phone, open its camera and point it at this code, then tap the link that pops up. The key, home address and weather location come across. Each phone still keeps its own lists.</p>
    <div class="qrbox">${svg || '<p class="hint">The code couldn’t be drawn — use the link below instead.</p>'}</div>
    <p class="hint mono" style="overflow-wrap:anywhere">${esc(link)}</p>
    <div class="actions"><button type="button" class="btn btn-ghost" data-act="copy-setup">Copy link</button><button type="button" class="btn btn-primary" data-act="sheet-close">Done</button></div>
    <p class="hint" style="margin-top:12px">Anyone with this code can use your key — but only on this website, and Google's daily ceiling caps it. Share it inside the family.</p>`;
}

/* --- address suggestions: as you type an event's address, Google (Places API) offers matching places nearby --- */
const PLACES_URL = 'https://places.googleapis.com/v1/places:autocomplete';
const SUGGEST_MIN = 3;                        // start suggesting at 3 characters
const SUGGEST_DELAY = 350;                    // ...and only after a short pause in typing, so each address costs a handful of requests
const suggestCache = {};                      // what Google said for each thing typed, for this visit
let suggestTimer = null, suggestSeq = 0;

async function fetchSuggestions(input) {
  if (suggestCache[input]) return suggestCache[input];
  const body = { input, includedRegionCodes: ['us'] };
  if (hasLoc()) body.locationBias = { circle: { center: { latitude: gset.lat, longitude: gset.lng }, radius: 50000 } };   // prefer places within ~30 miles of home
  const data = await googleFetch(PLACES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': gset.apiKey }, body: JSON.stringify(body) });
  const list = (data.suggestions || []).map(s => s.placePrediction).filter(p => p && p.placeId).map(p => ({
    id: p.placeId, text: (p.text && p.text.text) || '',
    main: (p.structuredFormat && p.structuredFormat.mainText && p.structuredFormat.mainText.text) || '',
    sub: (p.structuredFormat && p.structuredFormat.secondaryText && p.structuredFormat.secondaryText.text) || '',
  })).slice(0, 5);
  suggestCache[input] = list;
  return list;
}
function wireAddressSuggest(root) {
  const inp = root.querySelector('#f-address'), pid = root.querySelector('input[name=placeId]');
  if (!inp || !gset.apiKey) return;
  const field = inp.closest('.field'); field.classList.add('suggest');
  const list = document.createElement('ul'); list.className = 'suggest-list'; list.hidden = true; list.setAttribute('role', 'listbox'); field.appendChild(list);
  let items = [], hi = -1;
  const close = () => { list.hidden = true; inp.setAttribute('aria-expanded', 'false'); items = []; hi = -1; };
  const draw = () => {
    if (!items.length) return close();
    list.innerHTML = items.map((s, i) => `<li role="option" data-i="${i}" class="${i === hi ? 'on' : ''}" aria-selected="${i === hi}"><b>${esc(s.main || s.text)}</b>${s.sub ? `<span>${esc(s.sub)}</span>` : ''}</li>`).join('') + '<li class="foot" aria-hidden="true">Suggestions by Google</li>';
    list.hidden = false; inp.setAttribute('aria-expanded', 'true');
  };
  const pick = s => { if (!s) return; inp.value = s.text; if (pid) pid.value = s.id; close(); haptic(6); };
  inp.addEventListener('input', () => {
    if (pid) pid.value = '';                   // typing again means the picked place no longer applies
    const q = inp.value.trim();
    clearTimeout(suggestTimer);
    if (q.length < SUGGEST_MIN) return close();
    const seq = ++suggestSeq;
    suggestTimer = setTimeout(async () => {
      try { const res = await fetchSuggestions(q); if (seq !== suggestSeq) return; items = res; hi = -1; draw(); }
      catch (e) { close(); }                   // no suggestions is not an error worth showing — the typed address still works
    }, SUGGEST_DELAY);
  });
  inp.addEventListener('keydown', e => {
    if (list.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); hi = (hi + 1) % items.length; draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); hi = (hi - 1 + items.length) % items.length; draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(items[hi >= 0 ? hi : 0]); }
    else if (e.key === 'Escape') { e.stopPropagation(); close(); }
  });
  inp.addEventListener('blur', () => setTimeout(close, 150));
  list.addEventListener('pointerdown', e => { const li = e.target.closest('li[data-i]'); if (!li) return; e.preventDefault(); pick(items[Number(li.dataset.i)]); });
}

/* --- keeping things fresh, and the settings box --- */
function syncGoogle() {
  if (!gset.apiKey) return;
  refreshWeather();
  const needed = routesNeeded();
  needed.forEach(e => refreshRoute(e));
  // venue forecasts for the routes we already know the end of (new routes trigger their own when they arrive)
  const seen = new Set();
  needed.forEach(e => {
    const r = gcache.routes[routeKey(e)];
    if (r && r.end && seen.size < VENUE_MAX_PER_SYNC && !seen.has(venueKey(r.end))) { seen.add(venueKey(r.end)); refreshVenueWeather(r.end); }
  });
}
function setGStatus(kind, text) {
  const el = $('#gStatus'); if (!el) return;
  el.className = 'gstatus' + (kind ? ' ' + kind : '');
  const glyph = kind === 'ok' ? 'check-circle' : kind === 'bad' ? 'alert' : kind === 'busy' ? 'loader' : 'key';
  el.innerHTML = `${icon(glyph)}<span>${text}</span>`;
}
function updateGStatus() {
  if (!$('#gStatus')) return;
  if (!gset.apiKey) return setGStatus('', 'No key yet. Paste your Google API key above to turn on weather and drive times.');
  if (!hasLoc()) return setGStatus('', 'Key saved. Now set the weather location — tap “Use my location” or type coordinates.');
  const w = gcache.weather;
  if (w && w.current && !w.error) return setGStatus('ok', `Working. Weather updated ${agoShort(w.at)}${gset.homeAddress ? ' · drive times start from your home address' : ' · add a home address for drive times'}.`);
  if (w && w.error) return setGStatus('bad', friendlyError(w.error));
  setGStatus('', 'Ready to test. Tap “Test the connection” to ask Google for the weather.');
}
function useMyLocation() {
  if (!navigator.geolocation) return setGStatus('bad', 'This browser can’t share its location. Type the coordinates instead (Google Maps → right-click a spot → the numbers at the top).');
  setGStatus('busy', 'Asking this device for its location…');
  navigator.geolocation.getCurrentPosition(p => {
    gset.lat = Number(p.coords.latitude.toFixed(4)); gset.lng = Number(p.coords.longitude.toFixed(4));   // 4 decimals ≈ the block, not the doorstep
    saveGoogleSettings();
    const f = $('#gCoords'); if (f) f.value = `${gset.lat}, ${gset.lng}`;
    setGStatus('ok', 'Weather location set.');
    refreshWeather(true).then(updateGStatus);
  }, err => {
    setGStatus('bad', err.code === 1 ? 'Location permission was turned down. Allow it in the browser’s site settings, or type the coordinates.' : 'Couldn’t get a location right now. Try again, or type the coordinates.');
  }, { timeout: 12000, maximumAge: 600e3 });
}
async function testGoogle() {
  if (!gset.apiKey) return setGStatus('bad', 'Paste a key first.');
  if (!hasLoc()) return setGStatus('bad', 'Set the weather location first.');
  setGStatus('busy', 'Asking Google for the weather…');
  await refreshWeather(true);
  const w = gcache.weather;
  if (!w || !w.current || w.error) return setGStatus('bad', friendlyError(w && w.error));
  const ev = routesNeeded()[0];
  if (!ev) return setGStatus('ok', `Weather works (${Math.round(w.current.temp)}°, ${w.current.text}). ${gset.homeAddress ? 'Add an address to an upcoming event to test drive times.' : 'Add a home address to turn on drive times.'}`);
  setGStatus('busy', `Weather works. Now asking for the drive to “${esc(ev.title)}”…`);
  await refreshRoute(ev, true);
  const r = gcache.routes[routeKey(ev)];
  if (r && r.sec) setGStatus('ok', `Everything works. ${Math.round(w.current.temp)}° and ${w.current.text}; the drive to “${esc(ev.title)}” is about ${Math.round(r.sec / 60)} min.`);
  else setGStatus('bad', `Weather works, but the drive time didn’t: ${friendlyError(r && r.error)}`);
}

/* ---------- 9. BOOT ---------- */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#fab').addEventListener('click', () => { const fn = FAB_ACTIONS[current]; if (fn) fn(); });
importSetupFromUrl();
render();
</script>
